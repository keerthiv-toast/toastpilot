<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToastPilot — Thank You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --cyan: #00a3d9;
    --cyan2: #38d0ff;
    --magenta: #e0197d;
    --pink: #f472b6;
    --font: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: #05070d;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }

  /* 16:9 cinematic stage */
  .stage {
    position: relative;
    width: 1280px; height: 720px;
    background:
      radial-gradient(720px 520px at 50% 42%, rgba(0,163,217,0.22), transparent 62%),
      radial-gradient(800px 600px at 50% 120%, rgba(224,25,125,0.16), transparent 60%),
      radial-gradient(600px 480px at 12% 10%, rgba(124,92,255,0.10), transparent 60%),
      linear-gradient(160deg, #070a12 0%, #0b0a14 55%, #06070c 100%);
    border-radius: 22px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.5);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  /* bokeh */
  .bokeh { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .bokeh i {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,210,255,0.85), rgba(0,163,217,0.1) 70%, transparent);
    filter: blur(0.5px);
  }
  /* faint orbital ring */
  .ring {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-12deg);
    width: 980px; height: 560px; border-radius: 50%;
    border: 1.5px solid rgba(0,163,217,0.16); z-index: 1;
  }
  .ring.r2 { width: 760px; height: 420px; border-color: rgba(224,25,125,0.14); }

  .content { position: relative; z-index: 4; }

  .logo {
    display: inline-flex; align-items: center; gap: 14px; margin-bottom: 38px;
  }
  .logo svg { width: 56px; height: 56px; }
  .logo-text { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.03em; }
  .logo-text .t1 { color: #fff; } .logo-text .t2 { color: #ff8a3d; }

  .thanks {
    font-size: 6rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(115deg, var(--cyan2) 0%, #7fb4ff 45%, var(--pink) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .closing {
    font-size: 1.6rem; font-weight: 800; color: #fff; margin-top: 22px; letter-spacing: -0.01em;
  }
  .closing .grad {
    background: linear-gradient(90deg, var(--cyan2), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .sub { font-size: 1.05rem; color: #9fb6cf; margin-top: 16px; font-weight: 500; }

  .pills { display: flex; gap: 12px; justify-content: center; margin-top: 38px; }
  .pill {
    font-size: 0.85rem; font-weight: 700; color: #d7f1ff;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(0,163,217,0.4); background: rgba(0,163,217,0.10);
  }

  .link {
    margin-top: 34px; font-size: 0.95rem; font-weight: 700;
    color: #ffb454; letter-spacing: 0.01em;
  }

  .footer {
    position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
    font-size: 0.78rem; color: rgba(255,255,255,0.40); z-index: 4; font-weight: 500;
  }
  .footer-url { color: #ffb454; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="bokeh" id="bokeh"></div>

    <div class="content">
      <div class="logo">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 16c-19 0-31 11-31 26v3c-6 1-10 6-10 12s4 11 10 12v3c0 4 3 7 7 7h48c4 0 7-3 7-7V69c6-1 10-6 10-12s-4-11-10-12v-3c0-15-12-26-31-26z"
                stroke="#ff8a3d" stroke-width="6" fill="none" stroke-linejoin="round"/>
        </svg>
        <div class="logo-text"><span class="t1">Toast</span><span class="t2">Pilot</span></div>
      </div>

      <div class="thanks">Thank You</div>

      <div class="closing">Quality stops being a meeting and becomes <span class="grad">infrastructure.</span></div>
      <div class="sub">Autonomous QA for Unified Inventory — on every merge, automatically.</div>

      <div class="pills">
        <span class="pill">⚡ Zero-touch</span>
        <span class="pill">🩹 Self-healing</span>
        <span class="pill">🧠 AI-driven</span>
      </div>
    </div>

    <div class="footer"><span class="footer-url">keerthiv-toast.github.io/toastpilot</span> &nbsp;·&nbsp; Toast Hackathon 2026 · Retail Unified Inventory Mobile</div>
  </div>

  <script>
    const b = document.getElementById('bokeh');
    const seeds = [0.4,0.3,0.5,0.25,0.45,0.3,0.5,0.35,0.4,0.3,0.45,0.25,0.4,0.5,0.3,0.4,0.35,0.45];
    seeds.forEach((op, n) => {
      const d = document.createElement('i');
      const size = 3 + (n % 5) * 2;
      d.style.width = size + 'px'; d.style.height = size + 'px';
      d.style.left = (5 + (n * 53) % 92) + '%';
      d.style.top = (6 + (n * 37) % 88) + '%';
      d.style.opacity = op;
      b.appendChild(d);
    });
  </script>
</body>
</html>
