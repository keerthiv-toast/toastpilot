<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToastPilot — Hackathon Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#0f1b2d; --muted:#5a6e88; --cyan:#00a3d9; --cyan2:#38d0ff;
    --magenta:#e0197d; --pink:#f472b6; --purple:#7c5cff; --orange:#ec6316;
    --font:'Inter',-apple-system,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:#e6edf5; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .stage { position:relative; width:1280px; height:720px;
    background: radial-gradient(720px 420px at 88% 8%, rgba(0,163,217,0.08), transparent),
                radial-gradient(720px 460px at 6% 96%, rgba(224,25,125,0.07), transparent),
                linear-gradient(180deg,#ffffff,#eef4fb);
    border:1px solid #dde7f1; border-radius:22px; box-shadow:0 40px 90px rgba(15,40,80,0.16);
    overflow:hidden; padding:56px 70px;
    display:flex; flex-direction:column; }
  .footer { position:absolute; bottom:22px; right:32px; font-size:0.74rem; color:#9fb0c4; font-weight:500; }

  .head { text-align:center; }
  .head h1 { font-size:3rem; font-weight:900; letter-spacing:-0.03em; color:var(--ink); line-height:1; }
  .head .bar { width:150px; height:6px; border-radius:4px; margin:16px auto 0; background:linear-gradient(90deg,var(--cyan),var(--magenta)); }
  .head .sub { font-size:1rem; color:var(--muted); font-weight:600; margin-top:14px; }

  .team {
    flex:1; display:flex; align-items:center; justify-content:center; gap:44px;
  }

  /* member CARD */
  .member {
    text-align:center; width:300px;
    background:linear-gradient(180deg,#ffffff,#f7fafe);
    border:1px solid #e6edf5; border-radius:24px;
    box-shadow:0 22px 50px rgba(25,55,100,0.13);
    padding:54px 26px 30px; position:relative; overflow:hidden;
  }
  .member::before {
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
  }
  .m1::before { background:linear-gradient(90deg,#00a3d9,#38d0ff); }
  .m2::before { background:linear-gradient(90deg,#7c5cff,#a78bfa); }
  .m3::before { background:linear-gradient(90deg,#e0197d,#f472b6); }
  /* soft corner glow per card */
  .member::after {
    content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px;
    border-radius:50%; filter:blur(40px); opacity:0.5; z-index:0;
  }
  .m1::after { background:rgba(0,163,217,0.28); }
  .m2::after { background:rgba(124,92,255,0.26); }
  .m3::after { background:rgba(224,25,125,0.24); }

  .photo {
    width:186px; height:186px; margin:0 auto 22px;
    border-radius:50%; padding:5px;
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;
  }
  /* gradient ring frame */
  .photo::before {
    content:''; position:absolute; inset:0; border-radius:50%; padding:4px;
    background:linear-gradient(135deg,var(--cyan),var(--magenta));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .avatar {
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-size:3.4rem; font-weight:900; color:#fff; letter-spacing:-0.02em;
  }
  .a1 { background:linear-gradient(145deg,#00a3d9,#0088b3); box-shadow:0 16px 36px rgba(0,163,217,0.40); }
  .a2 { background:linear-gradient(145deg,#7c5cff,#6d28d9); box-shadow:0 16px 36px rgba(124,92,255,0.40); }
  .a3 { background:linear-gradient(145deg,#e0197d,#be145f); box-shadow:0 16px 36px rgba(224,25,125,0.40); }
  /* if a real photo is added, it fills the avatar */
  .avatar img { width:100%; height:100%; object-fit:cover; }

  .name { font-size:1.22rem; font-weight:800; color:var(--ink); letter-spacing:-0.01em; position:relative; z-index:1; }
  .role {
    display:inline-block; margin-top:11px;
    font-size:0.82rem; font-weight:800; color:#fff;
    padding:6px 18px; border-radius:999px; position:relative; z-index:1;
  }
  .r1 { background:linear-gradient(135deg,#00a3d9,#38d0ff); box-shadow:0 6px 16px rgba(0,163,217,0.30); }
  .r2 { background:linear-gradient(135deg,#7c5cff,#a78bfa); box-shadow:0 6px 16px rgba(124,92,255,0.30); }
  .r3 { background:linear-gradient(135deg,#e0197d,#f472b6); box-shadow:0 6px 16px rgba(224,25,125,0.30); }
</style>
</head>
<body>
  <div class="stage">
    <div class="head">
      <h1>Toast Hackathon Group</h1>
      <div class="bar"></div>
      <div class="sub">The team behind ToastPilot</div>
    </div>

    <div class="team">
      <div class="member m1">
        <div class="photo">
          <!-- To use a real photo: put keerthi.jpg next to this file -->
          <div class="avatar a1"><img src="keerthi.jpg" alt="" onerror="this.style.display='none';this.parentNode.textContent='KV'"></div>
        </div>
        <div class="name">Keerthi Venkataraman</div>
        <div class="role r1">iOS Mobile</div>
      </div>

      <div class="member m2">
        <div class="photo">
          <div class="avatar a2"><img src="sangeetha.jpg" alt="" onerror="this.style.display='none';this.parentNode.textContent='SR'"></div>
        </div>
        <div class="name">Sangeethapriya Rengasamy</div>
        <div class="role r2">DPS</div>
      </div>

      <div class="member m3">
        <div class="photo">
          <div class="avatar a3"><img src="shruti.jpg" alt="" onerror="this.style.display='none';this.parentNode.textContent='SJ'"></div>
        </div>
        <div class="name">Shruti Joshi</div>
        <div class="role r3">iOS Mobile</div>
      </div>
    </div>

    <div class="footer">© 2026 Toast, Inc. · Retail Unified Inventory Mobile</div>
  </div>
</body>
</html>
